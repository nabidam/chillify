[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
version_path_separator = os
timezone = UTC

# The database URL is supplied at runtime by migrations/env.py from the
# validated application configuration. It is intentionally absent here so a
# stale file value can never point migrations at the wrong SQLite database.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
