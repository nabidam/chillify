# Chillify reverse proxy and SPA host.
#
# Runs unprivileged on 8080 with a read-only root filesystem; every writable
# path is a tmpfs mount declared in compose.yaml. Neither SSE nor media
# streaming is buffered, so job events and byte ranges reach the browser as
# the API produces them.

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    client_max_body_size 12m;
    client_body_timeout 30s;
    keepalive_timeout 65s;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Single-page application. Hashed build assets are immutable; the
        # entry document is never cached so a redeploy is picked up at once.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Server-sent job events. Buffering here would batch progress updates
        # and defeat the durable event stream.
        location = /api/v1/events {
            proxy_pass http://api:8000;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }

        location /api/ {
            proxy_pass http://api:8000;
            proxy_read_timeout 60s;
        }

        # Media byte ranges pass through untouched so seeking works and large
        # files are never staged in the proxy.
        location /media/ {
            proxy_pass http://api:8000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
