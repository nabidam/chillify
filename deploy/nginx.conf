# Chillify reverse proxy and SPA host.
#
# Runs unprivileged on 8080 with a read-only root filesystem; every writable
# path is a tmpfs mount declared in compose.yaml. Neither SSE nor media
# streaming is buffered, so job events and byte ranges reach the browser as
# the API produces them.

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;

    sendfile on;
    tcp_nopush on;
    server_tokens off;

    client_max_body_size 12m;
    client_body_timeout 30s;
    keepalive_timeout 65s;

    proxy_http_version 1.1;
    # $http_host, not $host: $host silently drops a non-default port from the
    # Host header, but MutationGuardMiddleware's same-origin check compares
    # this forwarded Host against the browser's own Origin verbatim (which
    # does carry a non-default port, e.g. "http://localhost:8788"). With
    # $host, every mutating request behind a non-default port was rejected as
    # cross-origin — invisible to a unit test constructing its own Host
    # header, only visible end to end through the real proxy, which is what
    # surfaced it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Baseline hardening on every response, static or proxied: this is the
        # one ingress point, so it is the one place these apply to both. None
        # of the three changes what a legitimate same-origin browser request
        # can do; each only narrows what a hostile response or embedding could.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;

        # Single-page application. Hashed build assets are immutable; the
        # entry document is never cached so a redeploy is picked up at once.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }

        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Server-sent job events. Buffering here would batch progress updates
        # and defeat the durable event stream.
        location = /api/v1/events {
            proxy_pass http://api:8000;
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection "";
            proxy_read_timeout 1h;
            chunked_transfer_encoding off;
        }

        location /api/ {
            proxy_pass http://api:8000;
            # Spotify link inspection (spotdl's `save`) is bounded at 180 s by
            # the backend's own inspect timeout — real headroom over a proxy,
            # since it took ~140 s over a real SOCKS proxy once traffic
            # actually reaches it (see spotdl.py's `_INSPECT_TIMEOUT_SECONDS`).
            # This must stay above that bound or nginx cuts the response
            # before the backend's own timeout ever gets a chance to answer.
            proxy_read_timeout 200s;
        }

        # Media byte ranges pass through untouched so seeking works and large
        # files are never staged in the proxy.
        location /media/ {
            proxy_pass http://api:8000;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
